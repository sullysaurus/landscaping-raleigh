name: Update SEO dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: write

jobs:
  search-console:
    if: ${{ vars.GSC_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the latest Search Console and Analytics snapshots
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: https://www.landscapingraleigh.com/
          GA4_PROPERTY_ID: '548354885'
        run: node scripts/sync-search-console.mjs
      - name: Publish the updated dashboard data
        run: |
          if git diff --quiet -- src/data/gsc-snapshot.json src/data/ga4-snapshot.json; then
            echo "No Google reporting changes to publish."
            exit 0
          fi
          git config user.name "seo-dashboard-bot"
          git config user.email "seo-dashboard-bot@users.noreply.github.com"
          git add src/data/gsc-snapshot.json src/data/ga4-snapshot.json
          git commit -m "Update Google dashboard data"
          git push
